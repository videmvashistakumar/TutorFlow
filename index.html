<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        var palette = 'ocean';
        try {
          var s = JSON.parse(localStorage.getItem('tutorflow.settings.v1')) || {};
          var theme = s.theme;
          var dark = theme === 'dark' ||
            (theme === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
          if (s.palette) palette = s.palette;
        } catch (e) { /* ignore malformed settings */ }
        try { document.documentElement.setAttribute('data-palette', palette); } catch (e) { /* noop */ }
      })();
    </script>
    <title>TutorFlow</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
